# Everything that has to be green before a change lands.
#
# The four checks are the same four `make ci` runs, spelled out here rather than
# delegated to the Makefile so that a reader of this file can see what actually
# runs without opening another one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again. A pull request
# that receives three commits in a minute should spend CI minutes on the last
# one. `main` is excluded from cancellation by including the ref in the group,
# so a merge queue is never cut short by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Nothing in this workflow writes to the repository,
# publishes a package or comments on a pull request, so nothing needs more.
permissions:
  contents: read

env:
  # Fail on a warning that pip would otherwise print and nobody would read.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Style, formatting and types are checked once rather than per Python version:
  # ruff's rules do not vary across the matrix, and mypy is pinned to
  # python_version = "3.10" in pyproject.toml, so running it three times would
  # produce three identical results.
  static:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check --output-format=github .

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: mypy --strict
        run: python -m mypy --strict src

  test:
    name: pytest on ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Do not cancel 3.12 because 3.10 failed. A version-specific failure is
      # exactly the thing this matrix exists to find, and knowing whether it is
      # one version or all three is the first question anyone asks.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: pytest
        # Collects tests/ and the doctests in src/nabla, per pyproject.toml.
        run: python -m pytest -q

  examples:
    name: run the examples
    runs-on: ubuntu-24.04
    # The char transformer takes about 90 seconds on a warm laptop core and
    # rather longer on a shared runner. Fifteen minutes is generous enough that
    # a slow runner is not a red build and tight enough that a hang is caught.
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Two moons
        run: python examples/mlp_moons/train.py

      - name: Generated digits
        run: python examples/mnist_style/train.py

      - name: Character transformer
        run: python examples/char_transformer/train.py

      - name: Overhead benchmark
        # Asserts that the taped gradients equal the hand-derived ones before it
        # times anything, so this job checks correctness as well as speed. The
        # timings themselves are not asserted on: a shared runner's numbers are
        # not comparable to the ones in the README.
        run: python benchmarks/overhead.py
